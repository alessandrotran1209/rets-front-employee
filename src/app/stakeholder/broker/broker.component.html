<div id="broker-search">
  <div class="mat-title">TÌM KIẾM</div>
  <div class="row mat-body-2">
    <div class="col">
      <div>Mã môi giới</div>
      <div class="input-group input-group-sm">
        <input
          id="search-name"
          class="form-control form-control-lg border rounded mat-body-1"
          type="search"
          placeholder="Điền tên khách hàng"
          aria-label="Search"
        />
        <i class="fas fa-search"></i>
      </div>
    </div>
    <div class="col">
      <div>Tên môi giới</div>
      <div class="input-group input-group-sm">
        <input
          id="search-card"
          class="form-control form-control-lg border rounded mat-body-1"
          type="search"
          placeholder="Điền CMND/CCCD"
          aria-label="Search"
        />
        <i class="fas fa-search"></i>
      </div>
    </div>
    <div class="col">
      <div>Trạng thái</div>
      <div class="input-group input-group-sm">
        <select class="form-control select2bs4" style="width: 100%">
          <option selected="selected">1</option>
          <option>2</option>
        </select>
      </div>
    </div>
    <div class="col align-self-end">
      <button
        type="submit"
        class="btn btn-default float-end mat-button"
        style="background-color: #004aae; color: #ffffff; text-align: center"
      >
        Tìm kiếm
      </button>
    </div>
    <div class="col align-self-end">
      <button
        id="btn-clr"
        type="submit"
        class="btn btn-default float-end mat-button"
        style="background-color: #d2d2d2; text-align: center"
      >
        Clear
      </button>
    </div>
  </div>
</div>
<hr class="my-4" />

<div id="modal-broker" class="modal fade show">
  <div class="modal-dialog modal-lg">
    <div class="modal-broker-content">
      <div class="modal-broker-header">
        <div>
          <h3>Thêm mới môi giới</h3>
        </div>
        <button
          _ngcontent-c6=""
          aria-label="Close"
          class="close"
          data-dismiss="modal"
          type="button"
          onclick="document.getElementById('modal-broker').style.display='none'"
        >
          <span _ngcontent-c6="" aria-hidden="true">×</span>
        </button>
      </div>
      <!-- /.card-header -->
      <div class="modal-broker-body">
        <form>
          <div class="row">
            <div class="col">
              <div class="form-group">
                <label>Họ và tên -CMND</label>
                <input type="text" class="form-control" />
              </div>
              <!-- /.form-group -->
              <div class="form-group">
                <label>Mã môi giới viên</label>
                <input type="text" class="form-control" />
              </div>
            </div>
            <div class="col">
              <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" class="form-control" disabled />
              </div>
              <div class="form-group">
                <label>Ngày bắt đầu làm việc</label>
                <div class="input-group">
                  <input
                    type="date"
                    name="starting_date"
                    placeholder="dd/mm/yyyy"
                  />
                </div>
              </div>
            </div>
            <div class="col">
              <div class="form-group">
                <label>Email</label>
                <input type="text" class="form-control" disabled />
              </div>
              <div class="form-group">
                <button type="submit" class="btn btn-default float-end">
                  Thêm mới
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="modal-broker-info" class="modal fade show">
  <div class="modal-dialog modal-lg">
    <div class="modal-broker-info-content">
      <div class="modal-broker-info-header">

          <h3>Cập nhật môi giới</h3>
        </div>
        <button

          aria-label="Close"

          data-dismiss="modal"
          type="button"

        >

        </button>
      </div>
      <!-- /.card-header -->
      <div class="modal-broker-info-body">
        <form>
          <div class="row">
            <div class="col">
              <div class="form-group">
                <label>Họ và tên -CMND</label>
                <input type="text" class="form-control" />
              </div>
              <!-- /.form-group -->
              <div class="form-group">
                <label>Mã môi giới viên</label>
                <input type="text" class="form-control" />
              </div>
            </div>
            <div class="col">
              <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" class="form-control" disabled />
              </div>

                <div class="input-group">

            </div>

              </div>
              <div class="form-group">
                <button type="submit" class="btn btn-default pull-right">
                  Cập nhật
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
