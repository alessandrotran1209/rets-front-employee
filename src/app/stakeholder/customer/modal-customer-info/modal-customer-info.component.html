<div id="modal-customer-info" class="modal fade show">
  <div class="modal-dialog modal-lg">
  <div class="modal-customer-content">
  <div class="modal-customer-header">
    <div>
      <h3>Cập nhật khách hàng</h3>
    </div>
    <button _ngcontent-c6="" aria-label="Close" class="close" data-dismiss="modal" type="button" onclick="document.getElementById('modal-customer-info').style.display='none'">
      <span _ngcontent-c6="" aria-hidden="true">×</span>
    </button>
  </div>
  <!-- /.card-header -->
  <div class="modal-customer-body">
    <form>
    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>Tên khách hàng</label>
          <input type="text" class="form-control">
        </div>
        <!-- /.form-group -->
        <div class="form-group">
          <label>Giới tính</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
            <label class="form-check-label" for="flexRadioDefault1">
              Nam
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
            <label class="form-check-label" for="flexRadioDefault2">
              Nữ
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>Ngày cấp CMND/CCCD</label>
          <div class="input-group">
            <input type="date" name="issue_date" placeholder="dd/mm/yyyy">
          </div>
        </div>
        <div class="form-group">
          <label>Ngân hàng</label>
          <select class="form-control select2bs4" style="width: 100%;">
            <option selected="selected">VPBank</option>
            <option>MBBank</option>
          </select>
        </div>
        <!-- /.form-group -->
      </div>
      <div class="col">
        <div class="form-group">
          <label>Quốc tịch</label>
          <select class="form-control select2bs4" style="width: 100%;">
            <option selected="selected">Việt Nam</option>
            <option>Another country</option>
          </select>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email">
        </div>

        <div class="form-group">
          <label>Nơi cấp CMND/CCD</label>
          <select class="form-control select2bs4" style="width: 100%;">
            <option selected="selected">Hà Nội</option>
            <option>...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Chi nhánh Ngân hàng</label>
          <select class="form-control select2bs4" style="width: 100%;">
            <option selected="selected">Hà Nội</option>
            <option>...</option>
          </select>
        </div>
        <!-- /.form-group -->
      </div>
      <div class="col">
        <div class="form-group">
          <label>Ngày sinh</label>
          <div class="input-group">
            <input type="date" name="issue_date" placeholder="dd/mm/yyyy">
          </div>
        </div>

        <div class="form-group">
          <label>Địa chỉ</label>
          <input type="text" class="form-control">
        </div>

        <div class="form-group">
          <label>Số tài khoản ngân hàng</label>
          <input type="text" class="form-control">
        </div>

        <div class="form-group">
          <label>Trạng thái</label>
          <select class="form-control select2bs4" style="width: 100%;">
            <option selected="selected">Đang hoạt động</option>
            <option>Không hoạt động</option>
          </select>
        </div>
      </div>
      <div class="col">
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="text" class="form-control">
        </div>

        <div class="form-group">
          <label>Số CMND/CCCD</label>
          <input type="text" class="form-control">
        </div>

        <div class="form-group">
          <label>Tên chủ tài khoản</label>
          <input type="text" class="form-control">
        </div>

        <button type="submit" class="btn btn-default pull-right">Submit</button>
      </div>
    </div>
  </form>
  </div>
</div>
</div>
</div>
