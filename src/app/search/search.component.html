<div id="search">
  <div><h3>TÌM KIẾM</h3></div>
    <div class="row">
      <div class="col">
        <div class="title">Tên khách hàng</div>
        <div class="input-group input-group-sm">
          <input id="search-name" class="form-control form-control-lg" type="search" placeholder="Điền tên khách hàng" aria-label="Search">
            <i class="fas fa-search"></i>
        </div>
      </div>
      <div class="col">
        <div class="title">CMND/CCCD</div>
        <div class="input-group input-group-sm">
          <input id="search-card" class="form-control form-control-lg" type="search" placeholder="Điền CMND/CCCD" aria-label="Search">
              <i class="fas fa-search"></i>
        </div>
      </div>
      <div class="col">
        <div class="title">Số điện thoại</div>
        <div class="input-group input-group-sm">
          <input id="search-number" class="form-control form-control-lg" type="search" placeholder="Điền SĐT" aria-label="Search">
              <i class="fas fa-search"></i>
        </div>
      </div>
      <div class="col">
        <div class="title">Username</div>
        <div class="input-group input-group-sm">
          <input id="search-username" class="form-control form-control-lg" type="search" placeholder="Điền username" aria-label="Search">
              <i class="fas fa-search"></i>
        </div>
      </div>
      <div class="col">
        <button type="submit" class="btn btn-default pull-right" style="background-color: #004AAE; color:#FFFFFF; text-align: center">Tìm kiếm</button>
      </div>
      <div class="col">
        <button id="btn-clr" type="submit" class="btn btn-default pull-right" style="background-color: #D2D2D2; text-align: center">Clear</button>
      </div>
  </div>
</div>
<hr class="my-4">
