<div id="search">
    <div class='mat-title'>TÌM KIẾM</div>
    <div class="row">
      <div class="col">
        <div class="mat-body-2">Tên khách hàng</div>
        <div class="justify-content-center d-flex">
          <input
            id="search-name"
            class="form-control form-control-lg border rounded mat-caption"
            type="search"
            placeholder="Điền tên khách hàng"
            aria-label="Search"
          />
          <span class="material-icons">
            search
            </span>
        </div>
      </div>
      <div class="col">
        <div class="mat-body-2">CMND/CCCD</div>
        <div class="justify-content-center d-flex">
          <input
            id="search-card"
            class="form-control form-control-lg border rounded mat-caption"
            type="search"
            placeholder="Điền CMND/CCCD"
            aria-label="Search"
          />
          <span class="material-icons text-center">
            search
            </span>
        </div>
      </div>
      <div class="col">
        <div class="mat-body-2">Số điện thoại</div>
        <div class="justify-content-center d-flex">
          <input
            id="search-number"
            class="form-control form-control-lg border rounded mat-caption"
            type="search"
            placeholder="Điền SĐT"
            aria-label="Search"
          />
          <span class="material-icons text-center">
            search
            </span>
        </div>
      </div>
      <div class="col ">
        <div class="mat-body-2">Username</div>
        <div class="justify-content-center d-flex">
          <input
            id="search-username"
            class="form-control form-control-lg border rounded mat-caption "
            type="search"
            placeholder="Điền username"
            aria-label="Search"
          />
          <span class="material-icons text-center">
            search
            </span>
        </div>
      </div>
      <div class="col align-self-end">
        <button
          type="submit"
          class="btn btn-default float-end mat-button"
          style="background-color: #004aae; color: #ffffff; text-align: center"
        >
          Tìm kiếm
        </button>
      </div>
      <div class="col align-self-end">
        <button
          id="btn-clr"
          type="submit"
          class="btn btn-default float-end mat-button"
          style="background-color: #d2d2d2; text-align: center"
        >
          Clear
        </button>
      </div>
    </div>
  </div>

  <div id="modal-info" class="modal fade show">
    <div class="modal-dialog modal-lg">
      <div class="modal-info-content">
        <div class="modal-info-header">
          <div>
            <h3>Thêm mới khách hàng</h3>
          </div>
          <button
            _ngcontent-c6=""
            aria-label="Close"
            class="close"
            data-dismiss="modal"
            type="button"
            onclick="document.getElementById('modal-info').style.display='none'"
          >
            <span _ngcontent-c6="" aria-hidden="true">×</span>
          </button>
        </div>
        <!-- /.card-header -->
        <div class="modal-info-body">
          <form>
            <div class="row">
              <div class="col">
                <div class="form-group">
                  <label>Tên khách hàng</label>
                  <input type="text" class="form-control" />
                </div>
  
                <div class="form-group">
                  <label>Giới tính</label>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="flexRadioDefault"
                      id="flexRadioDefault1"
                    />
                    <label class="form-check-label" for="flexRadioDefault1">
                      Nam
                    </label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="flexRadioDefault"
                      id="flexRadioDefault2"
                      checked
                    />
                    <label class="form-check-label" for="flexRadioDefault2">
                      Nữ
                    </label>
                  </div>
                </div>
  
                <div class="form-group">
                  <label>Ngày cấp CMND/CCCD</label>
                  <div class="input-group">
                    <input
                      type="date"
                      name="issue_date"
                      placeholder="dd/mm/yyyy"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label>Ngân hàng</label>
                  <select class="form-control select2bs4" style="width: 100%">
                    <option selected="selected">VPBank</option>
                    <option>MBBank</option>
                  </select>
                </div>
                <!-- /.form-group -->
              </div>
              <div class="col">
                <div class="form-group">
                  <label>Quốc tịch</label>
                  <select class="form-control select2bs4" style="width: 100%">
                    <option selected="selected">Việt Nam</option>
                    <option>Another country</option>
                  </select>
                </div>
  
                <div class="form-group">
                  <label>Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="exampleInputEmail1"
                    aria-describedby="emailHelp"
                    placeholder="Enter email"
                  />
                </div>
  
                <div class="form-group">
                  <label>Nơi cấp CMND/CCD</label>
                  <select class="form-control select2bs4" style="width: 100%">
                    <option selected="selected">Hà Nội</option>
                    <option>...</option>
                  </select>
                </div>
  
                <div class="form-group">
                  <label>Chi nhánh Ngân hàng</label>
                  <select class="form-control select2bs4" style="width: 100%">
                    <option selected="selected">Hà Nội</option>
                    <option>...</option>
                  </select>
                </div>
                <!-- /.form-group -->
              </div>
              <div class="col">
                <div class="form-group">
                  <label>Ngày sinh</label>
                  <div class="input-group">
                    <input
                      type="date"
                      name="issue_date"
                      placeholder="dd/mm/yyyy"
                    />
                  </div>
                </div>
  
                <div class="form-group">
                  <label>Địa chỉ</label>
                  <input type="text" class="form-control" />
                </div>
  
                <div class="form-group">
                  <label>Số tài khoản ngân hàng</label>
                  <input type="text" class="form-control" />
                </div>
              </div>
              <div class="col">
                <div class="form-group">
                  <label>Số điện thoại</label>
                  <input type="text" class="form-control" />
                </div>
  
                <div class="form-group">
                  <label>Số CMND/CCCD</label>
                  <input type="text" class="form-control" />
                </div>
  
                <div class="form-group">
                  <label>Tên chủ tài khoản</label>
                  <input type="text" class="form-control" />
                </div>
  
                <button type="submit" class="btn btn-default float-end">
                  Submit
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
