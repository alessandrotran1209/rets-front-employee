<div mat-dialog-title>
  <div class='row'>
    <div class='col'><p class='mat-body-2'>Khóa tài khoản</p></div>
    <div class='col'><button mat-mini-fab [mat-dialog-close]="true" class='float-end'>x</button></div>
  </div>
</div>
<mat-dialog-content>
  <div class="text-center">
    <mat-icon svgIcon="warning_circle"></mat-icon>
    <div class='mt-3 pb-3'><p class='mat-body-1'>Chắc chắn khóa tài khoản khách hàng?</p></div>
  </div>
</mat-dialog-content>
<div mat-dialog-actions align="end">
  <div class='row'>           
    <div class='col'><button mat-flat-button mat-dialog-close (click)='openSuccessSnackbar("Khóa")' id='cancel'>Hủy</button></div>
    <div class='col'><button mat-flat-button mat-dialog-close>OK</button></div>
  </div>
</div>
