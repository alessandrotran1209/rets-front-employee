<div mat-dialog-title>
  <div class='row'>
    <div class='col'><p class='mat-body-2'>Khóa tài khoản</p></div>
    <div class='col'><button mat-mini-fab [mat-dialog-close]="true" class='float-end'>x</button></div>
  </div>
</div>
<mat-dialog-content>
  <div class="text-center">
    <mat-icon svgIcon="warning_circle"></mat-icon>
    <div class='mt-3 pb-3'>
      <p class='mat-body-1' *ngIf="data==1">Chắc chắn khóa tài khoản khách hàng?</p>
      <p class='mat-body-1' *ngIf="data==0">Chắc chắn khóa tài khoản khách hàng?</p>
    </div>
  </div>
</mat-dialog-content>
<div mat-dialog-actions>
  <div class='row' style='width: 100%; text-align: center'>     
    <div class='col'>
      <button mat-flat-button mat-dialog-close *ngIf="data==1" (click)='openSuccessSnackbar("Khóa")' style='background-image: linear-gradient(to right, #fcb11f, #ffdc16);'>OK</button>
      <button mat-flat-button mat-dialog-close *ngIf="data==0" (click)='openSuccessSnackbar("Mở Khóa")' style='background-image: linear-gradient(to right, #fcb11f, #ffdc16);'>OK</button>
    </div>      
    <div class='col'><button mat-flat-button mat-dialog-close (click)='openFailureSnackbar()' style='background-color: #ECF0F4'>Hủy</button></div>    
  </div>
</div>
